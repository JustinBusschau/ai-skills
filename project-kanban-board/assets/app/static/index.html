<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%222%22 width=%224%22 height=%2212%22 rx=%221%22 fill=%22%232563eb%22/%3E%3Crect x=%226%22 y=%222%22 width=%224%22 height=%228%22 rx=%221%22 fill=%22%23d97706%22/%3E%3Crect x=%2211%22 y=%222%22 width=%224%22 height=%225%22 rx=%221%22 fill=%22%23059669%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="title-block">
      <h1 id="board-title">Loading board</h1>
      <span id="save-state" class="save-state" role="status" aria-live="polite"></span>
    </div>
    <button id="toggle-controls" class="toggle-controls" type="button" aria-expanded="false" aria-controls="controls">Filters and view</button>
    <div class="controls" id="controls">
      <input id="search" type="search" placeholder="Search tickets and comments" aria-label="Search tickets and comments (press / to focus)">
      <label>Assignee <select id="filter-assignee"></select></label>
      <label>Epic <select id="filter-epic"></select></label>
      <label>Label <select id="filter-label"></select></label>
      <label>Swimlanes
        <select id="lane-mode">
          <option value="none">None</option>
          <option value="epic">By epic</option>
          <option value="assignee">By assignee</option>
        </select>
      </label>
      <label>Colour by
        <select id="colour-mode">
          <option value="epic">Epic</option>
          <option value="label">First label</option>
          <option value="none">None</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="show-epics"> Epic cards</label>
      <label class="check"><input type="checkbox" id="show-subtasks"> Sub-tasks</label>
      <button id="new-ticket" class="primary" type="button">New ticket</button>
      <button id="open-overview" type="button">Overview</button>
      <button id="open-settings" type="button">Board settings</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section id="epic-strip" class="epic-strip" aria-label="Epics"></section>
  <main id="board" class="board" aria-label="Board"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="ticket-dialog" class="ticket-dialog"></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="overview-dialog" class="settings-dialog" aria-labelledby="overview-title"></dialog>
  <dialog id="prompt-dialog" class="prompt-dialog"></dialog>
  <noscript>This board needs JavaScript enabled.</noscript>
  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
